services:
  - type: web
    name: tersrh-places
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: off
    buildCommand: node --check server/places.mjs
    startCommand: npm run places
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: PLACES_HOST
        value: 0.0.0.0
      - key: PLACES_ALLOWED_ORIGINS
        value: https://nggatau2.github.io
      - key: GOOGLE_PLACES_KEY
        sync: false
      - key: PLACES_ACCESS_CODE
        sync: false
